[project]
name = "photontracer"
version = "1.1.0"
description = "PhotonTracer: Light scattering simulation"
authors = [{name = "Rafael Ottersberg", email = "rafael.ottersberg@slf.ch"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[build-system]
requires = [
    "scikit-build-core",
    "numpy"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.27"
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build"
wheel.packages = ["photontracer"]
install.components = ["photontracer"]

wheel.license-files = [
  "LICENSE",
  "src/photonTracer/THIRD_PARTY_NOTICES.md",
  "external/otk/LICENSE.txt",
  "external/otk/ShaderUtil/LICENSE.txt",
  "external/otk/Memory/LICENSE.txt",
  "external/optix/LICENSE.txt",
  "external/optix/license_info.txt",
  "external/pybind11/LICENSE",
  "external/embree/LICENSE.txt",
  "external/embree/third-party-programs.txt"
]

[project.optional-dependencies]
test = ["pytest", "trimesh"]

# Wheels for PyPI, built by .github/workflows/wheels.yml
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"
# One build directory per Python version; a shared one keeps the Python of the first build in its cache
config-settings = { "build-dir" = "build/{wheel_tag}" }
test-requires = ["pytest", "trimesh"]
# The runners have no GPU, so the tests of the OptiX backend are skipped
test-command = "pytest {project}/photontracer/test"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash {project}/scripts/install_wheel_dependencies.sh"
# The kernels are compiled to OptiX-IR, which the driver compiles for the GPU at run time, so one
# CUDA version serves all GPUs. CUDA 12.4 supports GCC up to 13, the image defaults to a newer one.
environment = { CUDACXX = "/usr/local/cuda-12.4/bin/nvcc", CUDAHOSTCXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++" }
# The driver libraries come with the user's driver and must never be bundled
repair-wheel-command = "auditwheel repair --exclude libcuda.so.1 --exclude libnvoptix.so.1 -w {dest_dir} {wheel}"

# There is no CUDA on the Mac; the wheels contain the Embree CPU backend only
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "bash {project}/scripts/install_wheel_dependencies_macos.sh"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CMAKE_PREFIX_PATH = "/tmp/onetbb-install" }
# delocate finds libtbb through DYLD_LIBRARY_PATH to bundle it
repair-wheel-command = "DYLD_LIBRARY_PATH=/tmp/onetbb-install/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# The wheels contain the OptiX and Embree backends, like on Linux
[tool.cibuildwheel.windows]
archs = ['AMD64']
before-all = 'powershell -File {project}\scripts\install_wheel_dependencies_windows.ps1'
# cibuildwheel installs delvewheel only for its default repair command
before-build = "pip install delvewheel"
environment = { CMAKE_PREFIX_PATH = 'C:\onetbb-install' }
# The driver DLLs come with the user's driver and must never be bundled
repair-wheel-command = 'delvewheel repair --add-path C:\onetbb-install\bin --exclude nvcuda.dll --exclude nvoptix.dll -w {dest_dir} {wheel}'
