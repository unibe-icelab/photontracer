name: Build
on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  build-optix:
    name: Compile OptiX build (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: optix
          max-size: 1G
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment_linux.yml
          activate-environment: photontracer
          miniforge-version: latest
      - name: Configure
        shell: bash -el {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=86
          -DPHOTONTRACER_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      - name: Build
        shell: bash -el {0}
        run: cmake --build build
      - name: Cache statistics
        if: always()
        run: ccache --show-stats
  cpu-tests:
    name: CPU build and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpu
          max-size: 500M
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libtbb-dev
          pip install numpy trimesh pytest
      - name: Build the Python package with the Embree backend
        run: >
          pip install -v .
          -C cmake.define.PHOTONTRACER_BUILD_OPTIX=OFF
          -C cmake.define.PHOTONTRACER_BUILD_TESTS=ON
          -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache
          -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: pytest photontracer/test
      - name: Cache statistics
        if: always()
        run: ccache --show-stats
