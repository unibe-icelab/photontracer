name: Build
on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  build-optix:
    name: Compile OptiX build (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment_linux.yml
          activate-environment: photontracer
          miniforge-version: latest
      - name: Configure
        shell: bash -el {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=86
          -DPHOTONTRACER_BUILD_TESTS=ON
      - name: Build
        shell: bash -el {0}
        run: cmake --build build
  cpu-tests:
    name: CPU tests (no CUDA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPHOTONTRACER_BUILD_OPTIX=OFF
          -DPHOTONTRACER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
