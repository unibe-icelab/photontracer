name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: CUDA Test Suite
    runs-on:
      - self-hosted
      - linux
      - x64
      - gpu
      - cuda
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show GPU and CUDA environment
        run: |
          nvidia-smi
          nvcc --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Configure C++ tests
        run: >
          cmake
          -S .
          -B build/tests
          -DPHOTONTRACER_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ tests
        run: cmake --build build/tests --config Release

      - name: Run C++ tests
        working-directory: build/tests
        run: ctest --output-on-failure --build-config Release

      - name: Run Python tests
        run: pytest photontracer/test -vv
